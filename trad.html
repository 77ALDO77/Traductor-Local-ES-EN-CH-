<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor y Transcriptor de Voz Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importar la librería de IA para el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-textarea {
            resize: none;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .status-dot.listening {
            background-color: #f87171; /* red-500 */
            animation: pulse 1.5s infinite;
        }
        .status-dot.stopped {
            background-color: #4b5563; /* gray-600 */
        }
        .status-dot.processing {
            background-color: #facc15; /* yellow-400 */
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-4xl mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Traductor y Transcriptor de Voz Local</h1>
            <p class="text-gray-400 mt-2">Habla en un idioma y obtén la traducción en tiempo real, todo en tu navegador.</p>
        </header>

        <main class="bg-gray-800 shadow-2xl rounded-2xl p-6">
            <!-- Model Status -->
            <div id="model-status" class="text-center bg-yellow-900/50 border border-yellow-700 text-yellow-300 p-3 rounded-lg mb-4">
                <p>Cargando modelo de traducción local... Esto puede tardar un momento la primera vez.</p>
            </div>

            <!-- Controls Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Source Language -->
                <div>
                    <label for="source-lang" class="block text-sm font-medium text-gray-300 mb-2">Hablar en:</label>
                    <select id="source-lang" class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="es-ES">Español (España)</option>
                        <option value="es-MX">Español (México)</option>
                        <option value="en-US" selected>Inglés (EE. UU.)</option>
                        <option value="fr-FR">Francés (Francia)</option>
                        <option value="de-DE">Alemán (Alemania)</option>
                        <option value="it-IT">Italiano (Italia)</option>
                        <option value="pt-BR">Portugués (Brasil)</option>
                        <option value="ja-JP">Japonés (Japón)</option>
                        <option value="ko-KR">Coreano (Corea)</option>
                        <option value="zh-CN">Chino (Mandarín)</option>
                    </select>
                </div>
                <!-- Target Language -->
                <div>
                    <label for="target-lang" class="block text-sm font-medium text-gray-300 mb-2">Traducir a:</label>
                    <select id="target-lang" class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="spa_Latn" selected>Español</option>
                        <option value="eng_Latn">Inglés</option>
                        <option value="fra_Latn">Francés</option>
                        <option value="deu_Latn">Alemán</option>
                        <option value="ita_Latn">Italiano</option>
                        <option value="por_Latn">Portugués</option>
                        <option value="jpn_Jpan">Japonés</option>
                        <option value="kor_Hang">Coreano</option>
                        <option value="zho_Hans">Chino (Mandarín)</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons and Status -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-6">
                <button id="start-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 transition-colors text-white font-bold py-2 px-6 rounded-lg flex items-center justify-center gap-2" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
                    Comenzar a Grabar
                </button>
                <button id="stop-btn" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 transition-colors text-white font-bold py-2 px-6 rounded-lg flex items-center justify-center gap-2" disabled>
                     <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 8H16V16H8V8Z"></path></svg>
                    Detener Grabación
                </button>
                 <div class="flex items-center gap-2 text-gray-400">
                    <span id="status-dot" class="status-dot stopped"></span>
                    <span id="status-text">Detenido</span>
                </div>
            </div>

            <!-- Text Areas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Texto Original (Transcripción)</label>
                    <textarea id="original-text" class="custom-textarea w-full h-64 bg-gray-700 border border-gray-600 rounded-lg p-3 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500" readonly placeholder="Aquí aparecerá el texto transcrito..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Traducción</label>
                    <textarea id="translated-text" class="custom-textarea w-full h-64 bg-gray-700 border border-gray-600 rounded-lg p-3 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500" readonly placeholder="Aquí aparecerá la traducción..."></textarea>
                </div>
            </div>
             <div id="error-message" class="mt-4 text-center text-red-400 font-medium hidden"></div>
        </main>
        
        <footer class="text-center mt-8 text-gray-500 text-sm">
            <p>Traducción local con Transformers.js. Transcripción con la API del Navegador.</p>
        </footer>

    </div>

    <script type="module">
        // Importar la función 'pipeline' de la librería de Transformers
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        document.addEventListener('DOMContentLoaded', () => {
            // UI Elements
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const sourceLangSelect = document.getElementById('source-lang');
            const targetLangSelect = document.getElementById('target-lang');
            const originalTextArea = document.getElementById('original-text');
            const translatedTextArea = document.getElementById('translated-text');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const errorMessage = document.getElementById('error-message');
            const modelStatus = document.getElementById('model-status');

            // Speech Recognition Setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showError("Tu navegador no soporta la API de Reconocimiento de Voz. Por favor, intenta con Chrome.");
                startBtn.disabled = true;
                return;
            }

            let recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            // State variables
            let finalTranscript = '';
            let isRecording = false;
            let translator = null;

            // Mapeo de idiomas para el modelo de traducción local
            const langCodeMap = {
                'es-ES': 'spa_Latn', 'es-MX': 'spa_Latn',
                'en-US': 'eng_Latn',
                'fr-FR': 'fra_Latn',
                'de-DE': 'deu_Latn',
                'it-IT': 'ita_Latn',
                'pt-BR': 'por_Latn',
                'ja-JP': 'jpn_Jpan',
                'ko-KR': 'kor_Hang',
                'zh-CN': 'zho_Hans'
            };

            // --- Local Translator Setup ---
            async function setupTranslator() {
                try {
                    // Carga el modelo de traducción. Es una instancia única (singleton).
                    // Se descargará la primera vez y luego se usará desde la caché.
                    translator = await pipeline('translation', 'Xenova/nllb-200-distilled-600M');
                    modelStatus.classList.add('hidden'); // Ocultar mensaje de carga
                    startBtn.disabled = false; // Habilitar el botón de inicio
                } catch (err) {
                    console.error('Failed to load translator model:', err);
                    showError('Error al cargar el modelo de traducción. Refresca la página.');
                    modelStatus.textContent = 'Error al cargar el modelo de traducción.';
                    modelStatus.classList.replace('bg-yellow-900/50', 'bg-red-900/50');
                    modelStatus.classList.replace('border-yellow-700', 'border-red-700');
                    modelStatus.classList.replace('text-yellow-300', 'text-red-300');
                }
            }
            setupTranslator(); // Iniciar la carga del modelo al cargar la página

            // --- Speech Recognition Event Handlers ---
            recognition.onstart = () => {
                isRecording = true;
                finalTranscript = '';
                originalTextArea.value = '';
                translatedTextArea.value = '';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                updateStatus('listening', 'Escuchando...');
            };

            recognition.onend = () => {
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                updateStatus('stopped', 'Detenido');
            };

            recognition.onerror = (event) => {
                let errorMsg = `Error de reconocimiento: ${event.error}`;
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    errorMsg = "Acceso al micrófono denegado. Por favor, permite el acceso en la configuración de tu navegador.";
                } else if (event.error === 'no-speech') {
                    errorMsg = "No se detectó voz. Inténtalo de nuevo.";
                }
                showError(errorMsg);
                updateStatus('stopped', 'Error');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const newFinalText = event.results[i][0].transcript;
                        finalTranscript += newFinalText + ' ';
                        translateText(newFinalText.trim()); // Traducir el segmento final
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                originalTextArea.value = finalTranscript + interimTranscript;
            };

            // --- Local Translation Logic ---
            async function translateText(textToTranslate) {
                if (!translator || !textToTranslate) return;

                const sourceLangCode = langCodeMap[sourceLangSelect.value];
                const targetLangCode = targetLangSelect.value;
                
                if (sourceLangCode === targetLangCode) {
                    translatedTextArea.value += textToTranslate.trim() + ' ';
                    return;
                }

                updateStatus('processing', 'Traduciendo...');

                try {
                    let output = await translator(textToTranslate, {
                        src_lang: sourceLangCode,
                        tgt_lang: targetLangCode,
                    });
                    const translatedText = output[0].translation_text;
                    translatedTextArea.value += translatedText.trim() + ' ';
                } catch (error) {
                    console.error('Local Translation Error:', error);
                    showError("No se pudo traducir el texto localmente.");
                } finally {
                   if (isRecording) {
                       updateStatus('listening', 'Escuchando...');
                   } else {
                       updateStatus('stopped', 'Detenido');
                   }
                }
            }

            // --- UI and Control Logic ---
            startBtn.addEventListener('click', () => {
                if (isRecording) return;
                try {
                    hideError();
                    recognition.lang = sourceLangSelect.value;
                    recognition.start();
                } catch (e) {
                     showError("No se pudo iniciar el reconocimiento. ¿Ya está en ejecución?");
                }
            });

            stopBtn.addEventListener('click', () => {
                if (!isRecording) return;
                recognition.stop();
            });

            function updateStatus(state, text) {
                statusDot.className = `status-dot ${state}`;
                statusText.textContent = text;
            }
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
            }

            function hideError() {
                 errorMessage.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
