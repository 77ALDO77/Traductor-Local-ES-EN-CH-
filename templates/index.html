<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BoC Translator - AI Translation Dashboard</title>
    <!-- OFFLINE MODE: Local Tailwind -->
    <script src="/static/vendor/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a61c2e",
                        "background-light": "#f8f6f6",
                        "background-dark": "#201214",
                    },
                    fontFamily: {
                        "display": ["system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="flex min-h-screen">
            <aside
                class="w-64 flex-shrink-0 bg-white dark:bg-background-dark dark:border-r dark:border-white/10 shadow-sm">
                <div class="flex h-full flex-col justify-between p-4">
                    <div class="flex flex-col gap-8">
                        <div class="flex items-center gap-3 px-3">
                            <div class="bg-primary rounded-lg p-2 flex items-center justify-center">
                                <!-- Icon: Translate -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="w-6 h-6 text-white">
                                    <path
                                        d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" />
                                </svg>
                            </div>
                            <div class="flex flex-col">
                                <h1 class="text-[#171212] dark:text-white text-lg font-bold leading-normal">BoC
                                    Translator</h1>
                                <p class="text-[#866569] dark:text-gray-400 text-sm font-normal leading-normal">Bank of
                                    China</p>
                            </div>
                        </div>
                        <nav class="flex flex-col gap-2">
                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 dark:bg-primary/20"
                                href="/">
                                <!-- Icon: Translate -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="w-5 h-5 text-primary">
                                    <path
                                        d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" />
                                </svg>
                                <p class="text-primary text-sm font-medium leading-normal">Text Translation</p>
                            </a>
                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"
                                href="/documents">
                                <!-- Icon: Description -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="w-5 h-5 text-[#171212] dark:text-gray-300">
                                    <path fill-rule="evenodd"
                                        d="M5.625 1.5H9a3.75 3.75 0 013.75 3.75v1.875c0 1.036.84 1.875 1.875 1.875H16.5a3.75 3.75 0 013.75 3.75v7.875c0 1.035-.84 1.875-1.875 1.875H5.625a1.875 1.875 0 01-1.875-1.875V3.375c0-1.036.84-1.875 1.875-1.875zM12.75 12a.75.75 0 00-1.5 0V18a.75.75 0 001.5 0V12zM8.25 14.25a.75.75 0 000 1.5h7.5a.75.75 0 000-1.5H8.25zM6.75 16.5a.75.75 0 01.75-.75h9a.75.75 0 010 1.5h-9a.75.75 0 01-.75-.75z"
                                        clip-rule="evenodd" />
                                </svg>
                                <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">Document
                                    Translator</p>
                            </a>

                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"
                                href="/voice">
                                <!-- Icon: Mic -->
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="w-5 h-5 text-[#171212] dark:text-gray-300">
                                    <path d="M8.25 4.5a3.75 3.75 0 117.5 0v8.25a3.75 3.75 0 11-7.5 0V4.5z" />
                                    <path
                                        d="M6 10.5a.75.75 0 01.75.75v1.5a5.25 5.25 0 1010.5 0v-1.5a.75.75 0 011.5 0v1.5a6.751 6.751 0 01-6 6.709v2.291h3a.75.75 0 010 1.5h-7.5a.75.75 0 010-1.5h3v-2.291a6.751 6.751 0 01-6-6.709v-1.5A.75.75 0 016 10.5z" />
                                </svg>
                                <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">Voice
                                    Translation</p>
                            </a>
                        </nav>
                    </div>
                </div>
            </aside>
            <main class="flex-1 p-8">
                <div class="flex flex-col gap-8 max-w-7xl mx-auto">
                    <div class="flex flex-wrap justify-between gap-3">
                        <div class="flex min-w-72 flex-col gap-2">
                            <p
                                class="text-[#171212] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">
                                Text Translation</p>
                            <p class="text-[#866569] dark:text-gray-400 text-base font-normal leading-normal">Translate
                                text between languages with high accuracy.</p>
                        </div>
                        <button id="translate-btn"
                            class="hidden items-center justify-center gap-2 h-12 px-6 bg-primary text-white font-medium rounded-lg shadow-sm hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <span>Translate</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- SOURCE PANEL -->
                        <div
                            class="flex flex-col gap-4 bg-white dark:bg-background-dark dark:border dark:border-white/10 p-6 rounded-xl shadow-sm">
                            <div
                                class="flex h-10 w-full items-center justify-center rounded-lg bg-background-light dark:bg-black/20 p-1">
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">English</span>
                                    <input checked name="language-source" type="radio" value="English"
                                        class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Spanish</span>
                                    <input name="language-source" type="radio" value="Spanish" class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Chinese</span>
                                    <input name="language-source" type="radio" value="Chinese" class="invisible w-0" />
                                </label>
                            </div>
                            <div class="flex flex-col flex-1 relative">
                                <textarea id="source-text"
                                    class="form-input flex w-full min-w-0 flex-1 resize-y rounded-lg text-[#171212] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e5dcdd] dark:border-white/20 bg-white dark:bg-background-dark focus:border-primary min-h-[300px] placeholder:text-[#866569] dark:placeholder:text-gray-500 p-4 text-base font-normal leading-relaxed"
                                    placeholder="Enter text to translate..."></textarea>
                                <span id="char-count"
                                    class="text-xs text-[#866569] dark:text-gray-500 pt-2 text-right">0 / 5000</span>
                            </div>
                            <div class="flex flex-wrap justify-start gap-4">
                                <button id="paste-btn"
                                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-white/10 dark:hover:bg-white/20 transition-colors text-sm font-medium text-gray-700 dark:text-gray-200">
                                    <!-- Icon: Paste -->
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
                                    </svg>
                                    <span>Paste Text</span>
                                </button>
                            </div>
                        </div>
                        <!-- TARGET PANEL -->
                        <div
                            class="flex flex-col gap-4 bg-white dark:bg-background-dark dark:border dark:border-white/10 p-6 rounded-xl shadow-sm relative">
                            <!-- Spinner Overlay -->
                            <div id="loading-spinner" class="hidden absolute top-6 right-6 z-10">
                                <svg class="animate-spin h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                        stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor"
                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                    </path>
                                </svg>
                            </div>

                            <div
                                class="flex h-10 w-full items-center justify-center rounded-lg bg-background-light dark:bg-black/20 p-1">
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">English</span>
                                    <input name="language-target" type="radio" value="English" class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Spanish</span>
                                    <input checked name="language-target" type="radio" value="Spanish"
                                        class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Chinese</span>
                                    <input name="language-target" type="radio" value="Chinese" class="invisible w-0" />
                                </label>
                            </div>
                            <div class="flex flex-col flex-1">
                                <div id="translation-output"
                                    class="form-input flex w-full min-w-0 flex-1 resize-y overflow-y-auto rounded-lg text-[#171212] dark:text-white border border-[#e5dcdd] dark:border-white/20 bg-background-light dark:bg-black/20 min-h-[300px] p-4 text-base font-normal leading-relaxed text-gray-400 whitespace-pre-wrap">
                                    Translation will appear here...
                                </div>
                            </div>
                            <div class="flex flex-wrap justify-start gap-4">
                                <button id="copy-btn"
                                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-white/10 dark:hover:bg-white/20 transition-colors text-sm font-medium text-gray-700 dark:text-gray-200">
                                    <!-- Icon: Copy -->
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                                    </svg>
                                    <span>Copy Translation</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/translation.js?v=6"></script>
</body>

</html>
