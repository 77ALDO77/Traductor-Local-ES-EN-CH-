<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BoC Translator - AI Translation Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a61c2e",
                        "background-light": "#f8f6f6",
                        "background-dark": "#201214",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <div class="flex min-h-screen">
            <aside
                class="w-64 flex-shrink-0 bg-white dark:bg-background-dark dark:border-r dark:border-white/10 shadow-sm">
                <div class="flex h-full flex-col justify-between p-4">
                    <div class="flex flex-col gap-8">
                        <div class="flex items-center gap-3 px-3">
                            <div class="bg-primary rounded-lg p-2 flex items-center justify-center">
                                <span class="material-symbols-outlined text-white text-2xl">translate</span>
                            </div>
                            <div class="flex flex-col">
                                <h1 class="text-[#171212] dark:text-white text-lg font-bold leading-normal">BoC
                                    Translator</h1>
                                <p class="text-[#866569] dark:text-gray-400 text-sm font-normal leading-normal">Bank of
                                    China</p>
                            </div>
                        </div>
                        <nav class="flex flex-col gap-2">
                            <!-- Cambiar los href del nav -->
                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 dark:bg-primary/20"
                                href="/">
                                <span class="material-symbols-outlined fill text-primary">translate</span>
                                <p class="text-primary text-sm font-medium leading-normal">Text Translation</p>
                            </a>
                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"
                                href="/documents">
                                <span
                                    class="material-symbols-outlined text-[#171212] dark:text-gray-300">description</span>
                                <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">Document
                                    Translator</p>
                            </a>

                            <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5"
                                href="/voice">
                                <span class="material-symbols-outlined text-[#171212] dark:text-gray-300">mic</span>
                                <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">Voice
                                    Translation</p>
                            </a>
                        </nav>
                    </div>
                </div>
            </aside>
            <main class="flex-1 p-8">
                <div class="flex flex-col gap-8 max-w-7xl mx-auto">
                    <div class="flex flex-wrap justify-between gap-3">
                        <div class="flex min-w-72 flex-col gap-2">
                            <p
                                class="text-[#171212] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">
                                Text Translation</p>
                            <p class="text-[#866569] dark:text-gray-400 text-base font-normal leading-normal">Translate
                                text between languages with high accuracy.</p>
                        </div>
                        <button id="translate-btn"
                            class="flex items-center justify-center gap-2 h-12 px-6 bg-primary text-white font-medium rounded-lg shadow-sm hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <span class="material-symbols-outlined">translate</span>
                            <span>Translate</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- SOURCE PANEL -->
                        <div
                            class="flex flex-col gap-4 bg-white dark:bg-background-dark dark:border dark:border-white/10 p-6 rounded-xl shadow-sm">
                            <div
                                class="flex h-10 w-full items-center justify-center rounded-lg bg-background-light dark:bg-black/20 p-1">
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">English</span>
                                    <input checked name="language-source" type="radio" value="English"
                                        class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Spanish</span>
                                    <input name="language-source" type="radio" value="Spanish" class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Chinese</span>
                                    <input name="language-source" type="radio" value="Chinese" class="invisible w-0" />
                                </label>
                            </div>
                            <div class="flex flex-col flex-1">
                                <textarea id="source-text"
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#171212] dark:text-white focus:outline-0 focus:ring-0 border border-[#e5dcdd] dark:border-white/20 bg-white dark:bg-background-dark focus:border-primary min-h-72 placeholder:text-[#866569] dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal"
                                    placeholder="Enter text to translate..."></textarea>
                                <span id="char-count"
                                    class="text-xs text-[#866569] dark:text-gray-500 pt-2 text-right">0 / 5000</span>
                            </div>
                            <div class="flex flex-wrap justify-start gap-4">
                                <button id="paste-btn"
                                    class="flex flex-col items-center gap-2 text-center w-20 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                                    <div class="rounded-full bg-background-light dark:bg-black/20 p-2.5">
                                        <span
                                            class="material-symbols-outlined text-[#171212] dark:text-gray-300 text-xl">content_paste</span>
                                    </div>
                                    <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">
                                        Paste</p>
                                </button>
                            </div>
                        </div>
                        <!-- TARGET PANEL -->
                        <div
                            class="flex flex-col gap-4 bg-white dark:bg-background-dark dark:border dark:border-white/10 p-6 rounded-xl shadow-sm">
                            <div
                                class="flex h-10 w-full items-center justify-center rounded-lg bg-background-light dark:bg-black/20 p-1">
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">English</span>
                                    <input name="language-target" type="radio" value="English" class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Spanish</span>
                                    <input checked name="language-target" type="radio" value="Spanish"
                                        class="invisible w-0" />
                                </label>
                                <label
                                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#171212] dark:has-[:checked]:text-white text-[#866569] dark:text-gray-400 text-sm font-medium leading-normal">
                                    <span class="truncate">Chinese</span>
                                    <input name="language-target" type="radio" value="Chinese" class="invisible w-0" />
                                </label>
                            </div>
                            <div class="flex flex-col flex-1">
                                <div id="translation-output"
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-auto rounded-lg text-[#171212] dark:text-white border border-[#e5dcdd] dark:border-white/20 bg-background-light dark:bg-black/20 min-h-72 p-4 text-base font-normal leading-normal text-gray-400">
                                    Translation will appear here...
                                </div>
                            </div>
                            <div class="flex flex-wrap justify-start gap-4">
                                <button id="copy-btn"
                                    class="flex flex-col items-center gap-2 text-center w-20 py-2.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                                    <div class="rounded-full bg-background-light dark:bg-black/20 p-2.5">
                                        <span
                                            class="material-symbols-outlined text-[#171212] dark:text-gray-300 text-xl">content_copy</span>
                                    </div>
                                    <p class="text-[#171212] dark:text-gray-300 text-sm font-medium leading-normal">Copy
                                    </p>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/translation.js"></script>
</body>

</html>
