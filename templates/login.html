<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoC Translator - Auditoría Login</title>
    <link rel="icon" type="image/png" href="/static/images/icon-boc-red.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #B22222;
            /* BoC Red */
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #8B0000;
        }

        .back-link {
            display: block;
            margin-top: 1rem;
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div style="display:flex; justify-content:center; margin-bottom:1rem;">
            <img src="/static/images/logo-boc.png" alt="BoC" style="height:60px;">
        </div>
        <h2>Acceso Auditoría</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <a href="/" class="back-link">← Volver al inicio</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Check credentials via basic auth call
            const headers = new Headers();
            headers.set('Authorization', 'Basic ' + btoa(username + ":" + password));

            try {
                const response = await fetch('/api/admin/audit-logs', { headers });

                if (response.ok) {
                    // Store credentials in session storage (simple approach) or standard browser cache
                    // But browser cache prompts are annoying. 
                    // Better approach: verify here, if ok, redirect to admin_audit with basic auth embedded in URL?
                    // No, that's deprecated.
                    // We will store in sessionStorage and use it in admin.js
                    sessionStorage.setItem('auth_token', btoa(username + ":" + password));
                    window.location.href = '/admin/auditoria';
                } else {
                    alert('Credenciales incorrectas');
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión');
            }
        });
    </script>
</body>

</html>
