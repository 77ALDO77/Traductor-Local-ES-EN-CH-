services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boc_translator_backend_v1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_HOST=http://vllm:8000
      - MODEL_NAME=Qwen/Qwen2.5-1.5B-Instruct
      - CLEANUP_INTERVAL_MINUTES=60
      - FILE_RETENTION_MINUTES=1440
      - LOG_LEVEL=INFO
      - ADMIN_USERNAME=admin_boc
      - ADMIN_PASSWORD=seguridad_boc_2026
    volumes:
      - boc_whisper_data:/app/models
      - boc_uploads:/app/uploads
      - ./static:/app/static
      - ./templates:/app/templates
      - ./backend:/app/backend
    networks:
      - translator_network
    depends_on:
      - vllm
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: boc_translator_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - translator_network

  vllm:
    image: vllm/vllm-openai:latest
    container_name: boc_translator_vllm_v1
    restart: unless-stopped
    ports:
      - "8001:8000"
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
      --gpu-memory-utilization 0.90
      --dtype auto
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - TZ=America/Lima
    volumes:
      - boc_vllm_data:/root/.cache/huggingface
    networks:
      - translator_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

