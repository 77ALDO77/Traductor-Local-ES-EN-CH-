networks:
  translator_network:
    driver: bridge
    name: boc_translator_net

volumes:
  boc_vllm_data:
    driver: local
    name: boc_vllm_data
  boc_whisper_data:
    driver: local
    name: boc_whisper_data
  boc_uploads:
    driver: local
    name: boc_uploads
